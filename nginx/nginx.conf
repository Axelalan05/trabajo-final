# Redirige todo el tráfico HTTP a HTTPS
server {
    listen 80;
    server_name gamevault.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name gamevault.local;

    ssl_certificate /etc/nginx/certs/gamevault.local.pem;
    ssl_certificate_key /etc/nginx/certs/gamevault.local-key.pem;

    client_max_body_size 20M;

    # API de Django
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Panel de administración de Django
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (Vue + Vite) — incluye soporte de WebSocket para el hot-reload
    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}